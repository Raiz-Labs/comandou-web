name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Padrão mínimo; jobs que precisarem de mais declaram no próprio job.
permissions:
  contents: read

# Em PR, um push novo cancela o run anterior; em push (dev/main) nada é cancelado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions de terceiros pinadas por SHA de commit (tags são mutáveis); o
      # Dependabot (github-actions) mantém o SHA e o comentário de versão em dia.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sem --omit=dev: no Angular quase tudo é build-time e acaba no bundle.
      - name: Auditoria de dependências
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

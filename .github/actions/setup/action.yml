name: Setup
description: Node 22 com cache do npm e npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

version: 2
updates:
  # cooldown: não adota release recém-publicada (janela para um pacote/action
  # comprometido ser detectado e retirado). Majors esperam mais.
  #
  # Grupos: cada dependência entra no PRIMEIRO grupo que casar, na ordem abaixo.
  # Majors não são ignorados — vêm agrupados para virar um PR visível por semana;
  # se o CI falhar, o PR é o lembrete do upgrade, feito numa branch feature/upgrade-*
  # (no Angular, com `ng update`, que aplica as migrações).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Framework e tooling do Angular sobem juntos, inclusive em major
      angular:
        patterns: ['@angular/*', '@angular-eslint/*']
      # vitest e @vitest/* exigem a mesma versão entre si (peer)
      vitest:
        patterns: ['vitest', '@vitest/*']
      majors:
        update-types: [major]
      minor-e-patch:
        update-types: [minor, patch]
    # typescript: o Angular fixa a faixa (21 pede >=5.9 <6.0; 22 pede >=6.0 <6.1). Major do TS
    # só junto com um `ng update` que o aceite; sozinho, o Dependabot propõe o TS 7, que quebra
    # o `npm ci`.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
